{% extends 'base.html' %}

{% block title %} Login Page {% endblock %}

{% block content %}
    <h1>Login Page</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log In</button>
    </form>
    <p>Don't have an staff account? <a href="{% url 'register_staff' %}">Sign up here</a></p>
{% endblock %}
