{% block title %} Login Page {% endblock %}

{% block content %}

      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log In</button>
      <p>Need to register?? <a href="{% url 'register_new_user' %}">Click here</a></p>

    </form>
{% endblock %}
