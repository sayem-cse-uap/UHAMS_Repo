{% extends 'base.html' %}

{% block title %}Log in - HN-UHAMS{% endblock %}
{% block body_class %}auth{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <p>Use your HN-UHAMS username and password.</p>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>
    </div>
    <p class="form-note">No account yet? <a href="{% url 'core:register' %}">Create one</a></p>
{% endblock %}
