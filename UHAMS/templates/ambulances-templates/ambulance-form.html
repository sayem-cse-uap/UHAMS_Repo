{% extends 'base.html' %}

{% block title %} UHAMS - {{ page_title }} {% endblock %}

{% block content %}
    <h1>{{ page_title }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit">{{ submit_label }}</button>
            <a href="{% url 'ambulances:list' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
