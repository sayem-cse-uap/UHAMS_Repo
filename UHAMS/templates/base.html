{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}title here, replace it in the child file {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}" class="hospital-name">HN-UHAMS</a>

            <ul class="menu">
                <li><a href="{% url 'staff-dashboard' %}">Staff Dashboard</a></li>
                <li><a href="#">Analytics</a></li>
                <li><a href="#">Settings</a></li>
            </ul>

            <div class="user-profile">
            {% if logged_in_user %}
                <img src="{% static 'images/horse-profile-pic.jpg' %}" width="20px">
                <span class="user-name">{{ logged_in_user.username }}</span>
            {% endif %}
            </div>
        </nav>
    </header>

    <hr>
    <main>
        {% block content %}
        content here, replace it with page's content
        {% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
