{% extends 'base.html' %}

{% block title %} UHAMS - New Emergency Call {% endblock %}

{% block content %}
    <h1>Log Emergency Call</h1>
    <p>The first available ambulance that has a driver is dispatched automatically.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log call &amp; dispatch</button>
    </form>
    <p><a href="{% url 'call-list' %}">&larr; All calls</a></p>
{% endblock %}
